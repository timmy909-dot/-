const timetable = {
    옥정: {
        1: {

        }
    },
    향산: {
        1: {
            1: {mon: ["도덕", "수학", "과학", "체육", "국어", "영어"],
                tue: ["수학", "과학", "체육", "영어"],
                wed: ["음악", "미술", "수학", "동아2"],
                thu: ["영어", "과학", "국어", "음악"],
                fri: []
            }
        }
    },
    신곡: {
        1: {
            1: {mon: ["기가", "스포츠", "과학B", "역사", "도덕", "국어A"],
                tue: ["역사", "진로", "수학", "사회", "영어"],
                wed: ["사회", "영어", "국어A", "체육", "수학"],
                thu: ["체육", "미술", "미술", "창체", "창체", "창체", "창체"],
                fri: []
            }
        }
    },
    금릉: {
        1: {
            1: {mon: ["국어2","미술", "스클", "도덕", "기가", "수학"],
                  tue: ["국어1", "주제", "주제", "영어", "과학", "체육", "정보"],
                  wed: ["체육", "진탐", "정보", "도덕", "수학", "국어1"],
                  thu: ["미술", "주제", "주제", "체육", "사회", "영어", "과학"],
                  fri: ["사회", "국어2", "수학", "진독", "기가", "창체"]
            }
        }
    }
};

const schoolSelect = document.getElementById("school");
const gradeSelect = document.getElementById("grade");
const classSelect = document.getElementById("class");
const scheduleBody = document.getElementById("schedule-body");

function createScheduleTable(periods = 7) {
    scheduleBody.innerHTML = "";
    for (let i = 1; i <= periods; i++) {
        const row = document.createElement("tr");
        row.innerHTML = `
            <th>${i}교시</th>
            <td id="mon${i}"></td>
            <td id="tue${i}"></td>
            <td id="wed${i}"></td>
            <td id="thu${i}"></td>
            <td id="fri${i}"></td>
        `;
        scheduleBody.appendChild(row);
    }
}

function updateSchedule() {
    const school = schoolSelect.value;
    const grade = gradeSelect.value;
    const cls = classSelect.value;

    if (!timetable[school] || !timetable[school][grade] || !timetable[school][grade][cls]) return;

    const schedule = timetable[school][grade][cls];
    const days = ["mon", "tue", "wed", "thu", "fri"];

    const maxPeriod = Math.max(...days.map(day => (schedule[day]?.length || 0)));
    createScheduleTable(maxPeriod);

    days.forEach(day => {
        schedule[day].forEach((subject, idx) => {
            const cell = document.getElementById(`${day}${idx + 1}`);
            if (cell) cell.textContent = subject || "";
        });
    });
}

function updateClass() {
    let classCount = 0;
    if (schoolSelect.value === "옥정") {
        classCount = gradeSelect.value === "1" ? 15 :
                     gradeSelect.value === "2" ? 12 : 11;
    } else if (schoolSelect.value === "금릉") {
        classCount = gradeSelect.value === "1" ? 8 :
                     gradeSelect.value === "2" ? 9 : 9;
    } else if (schoolSelect.value === "향산") {
        classCount = gradeSelect.value === "1" ? 7 :
                     gradeSelect.value === "2" ? 5 : 4;
    } else if (schoolSelect.value === "신곡") {
        classCount = gradeSelect.value === "1" ? 10 :
                     gradeSelect.value === "2" ? 9 : 8;
    }

    classSelect.innerHTML = "";
    for (let i = 1; i <= classCount; i++) {
        const option = document.createElement("option");
        option.textContent = `${i}반`;
        option.value = i;
        classSelect.appendChild(option);
    }
    classSelect.value = "1"; // 기본 선택
}

schoolSelect.addEventListener("change", () => {
    updateClass();
    updateSchedule();
});
gradeSelect.addEventListener("change", () => {
    updateClass();
    updateSchedule();
});
classSelect.addEventListener("change", updateSchedule);

// 초기 실행
updateClass();
updateSchedule();
</script>

<script>
// 하이라이트 기능
function highlightTodayAndCurrentClass() {
    const now = new Date();
    const dayNames = ["sun","mon","tue","wed","thu","fri","sat"];
    const today = dayNames[now.getDay()]; // 오늘 요일 (mon~fri)
    const hour = now.getHours();
    const minute = now.getMinutes();

    // 교시 시간대 설정 (이 교시 시간대는 예시로 추후에 변경 예정)
const classTimes = [
    {start:[9,0], end:[9,45]},   // 1교시: 09:00 ~ 09:45
    {start:[9,55], end:[10,40]}, // 2교시: 09:55 ~ 10:40
    {start:[10,50], end:[11,35]},// 3교시: 10:50 ~ 11:35
    {start:[11,45], end:[12,30]},// 4교시: 11:45 ~ 12:30
    // 점심시간: 12:30 ~ 13:20 (수업 아님)
    {start:[13,20], end:[14,5]}, // 5교시: 13:20 ~ 14:05
    {start:[14,15], end:[15,0]}, // 6교시: 14:15 ~ 15:00
    {start:[15,10], end:[15,55]} // 7교시: 15:10 ~ 15:55
];


    // 오늘 요일 칸 전체 노란색 하이라이트(색상은 색상 코드로 변경 가능)
    for (let i = 1; i <= 7; i++) {
        const cell = document.getElementById(`${today}${i}`);
        if (cell) {
            cell.style.backgroundColor = "#FFFF00"; // 오늘 수업 노란색 하이라이트(색상은 색상 코드로 변경 가능)
        }
    }

    // 현재 교시 계산
    classTimes.forEach((time, idx) => {
        const startMinutes = time.start[0]*60 + time.start[1];
        const endMinutes = time.end[0]*60 + time.end[1];
        const nowMinutes = hour*60 + minute;

        if (nowMinutes >= startMinutes && nowMinutes <= endMinutes) {
            const cell = document.getElementById(`${today}${idx+1}`);
            if (cell) {
                cell.style.backgroundColor = "#ADFF2F"; // 현재 수업 연두색 하이라이트(색상은 색상 코드로 변경 가능)
                cell.style.fontWeight = "bold";
            }
        }
    });
}

// 일정 업데이트 후 하이라이트
function updateSchedule() {
    const school = schoolSelect.value;
    const grade = gradeSelect.value;
    const cls = classSelect.value;

    if (!timetable[school] || !timetable[school][grade] || !timetable[school][grade][cls]) return;

    const schedule = timetable[school][grade][cls];
    const days = ["mon", "tue", "wed", "thu", "fri"];

    const maxPeriod = Math.max(...days.map(day => (schedule[day]?.length || 0)));
    createScheduleTable(maxPeriod);

    days.forEach(day => {
        schedule[day].forEach((subject, idx) => {
            const cell = document.getElementById(`${day}${idx + 1}`);
            if (cell) cell.textContent = subject || "";
        });
    });

    highlightTodayAndCurrentClass(); // 하이라이트
}

// 매 분마다 현재 수업 반영
setInterval(highlightTodayAndCurrentClass, 60000);
// 노트 작성 기능
// 초기 실행
updateClass();
updateSchedule();
</script>

// 노트 추가 (금칙어 입력 막기 적용)
function addNote() {
    const input = document.getElementById("noteInput");
    const noteText = input.value.trim();
    if (noteText === "") return;

    // 금칙어 검사
    if (bannedWords.some(word => noteText.includes(word))) {
        alert("400. That’s an error. Your client has issued a malformed or illegal request. That’s all we know.");
        input.value = ""; // 입력창 비우기
        return; // 저장 및 추가 중단
    }

    createNoteElement(noteText);
    saveNotes();
    input.value = "";
}

// 노트 요소 생성
function createNoteElement(text) {
    const li = document.createElement("li");
    li.textContent = text;

    const delBtn = document.createElement("button");
    delBtn.textContent = "삭제";
    delBtn.style.marginLeft = "10px";
    delBtn.onclick = function() {
        li.remove();
        saveNotes();
    };

    li.appendChild(delBtn);
    document.getElementById("noteList").appendChild(li);
}

// 노트 저장
function saveNotes() {
    const items = document.querySelectorAll("#noteList li");
    const notes = [];
    items.forEach(li => {
        // 버튼 텍스트 제외하고 노트 내용만 저장
        notes.push(li.firstChild.textContent);
    });
    localStorage.setItem("notes", JSON.stringify(notes));
}

// 페이지 로드 시 저장된 노트 불러오기
